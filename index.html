        <h1>Digital Commonplace Book</h1>
        <p>A digital commonplace book is an ancient method of recording extracts, thoughts, observations, and quotations in a structured private journal.</p>
        <h2>Key Capabilities</h2>
        <ul>
          <li><strong>3D Tactile Experience:</strong> Realistic page-turning and leather-bound spine interaction.</li>
          <li><strong>Bilingual Typography:</strong> Seamless toggle between classical Latin typography and Nastaliq Urdu script.</li>
          <li><strong>Multi-Format Notes:</strong> Type reflections, draw margin sketches, record spoken voice clips, or attach historical imagery.</li>
          <li><strong>Private &amp; Secure:</strong> Protected by Row Level Security (RLS) with instant local and cloud synchronization.</li>
        </ul>
        <p>Built with React, Vite, and Supabase by <a href="https://mariyamalikhokhar.com/">Mariyam Ali Khokhar</a>.</p>
